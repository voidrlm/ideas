<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Adwaita palette -->
    <linearGradient id="glass" x1="0" y1="10" x2="0" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="0.55" stop-color="#f8e45c"/>
      <stop offset="1" stop-color="#f5c211"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="60" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="38" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a9996"/>
      <stop offset="0.3" stop-color="#f6f5f4"/>
      <stop offset="0.65" stop-color="#deddda"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="metal-dark" x1="38" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="0.3" stop-color="#c0bfbc"/>
      <stop offset="0.65" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>
  </defs>

  <!-- glass; the darker copy underneath gives the Adwaita "thickness" -->
  <path d="M42 96c0-12-20-20-20-42a42 42 0 0 1 84 0c0 22-20 30-20 42z" fill="#e5a50a"/>
  <path d="M42 92c0-12-20-20-20-42a42 42 0 0 1 84 0c0 22-20 30-20 42z" fill="url(#glass)"/>
  <path d="M42 92c0-12-20-20-20-42a42 42 0 0 1 84 0c0 22-20 30-20 42z" fill="url(#glow)"/>
  <ellipse cx="43" cy="33" rx="7.5" ry="14" transform="rotate(35 43 33)" fill="#ffffff" opacity="0.55"/>

  <!-- filament -->
  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 91V71M73 91V71" stroke="#c64600"/>
    <path d="M55 71c0-7 4.5-10 4.5-4.5s4.5 6.5 4.5 0 4.5-5.5 4.5 0 4.5 2.5 4.5 4.5" stroke="#e66100"/>
  </g>

  <!-- screw base -->
  <rect x="38" y="89" width="52" height="10" rx="5" fill="url(#metal)"/>
  <rect x="40" y="99" width="48" height="9" rx="4.5" fill="url(#metal-dark)"/>
  <rect x="40" y="98" width="48" height="8" rx="4" fill="url(#metal)"/>
  <rect x="42" y="107" width="44" height="8" rx="4" fill="url(#metal-dark)"/>
  <rect x="42" y="106" width="44" height="7" rx="3.5" fill="url(#metal)"/>
  <path d="M51 113h26l-3.2 6.4a4 4 0 0 1-3.6 2.2h-12.4a4 4 0 0 1-3.6-2.2z" fill="#5e5c64"/>
  <path d="M51 113h26l-0.8 1.6h-24.4z" fill="#77767b"/>
</svg>
